# MSPC-GreenAI configuration defaults
# Runtime secret source: .env / environment variables only.
# Do not store real API keys in this file.
#
# Precedence:
# 1. Environment variables (.env) provide runtime secrets and can override selected defaults.
# 2. config.yaml provides non-sensitive defaults/documentation.
# 3. Built-in defaults in app/config.py fill any remaining gaps.

siliconflow:
  enabled: true
  api_key: ""  # Documented only; ignored at runtime. Put the real key in .env.
  base_url: "https://api.siliconflow.cn/v1"
  model: "Qwen/Qwen2.5-7B-Instruct"
  temperature: 0.35
  max_tokens: 650
  timeout_seconds: 30

system:
  app_name: "MSPC-GreenAI"
  offline_fallback: true
  language: "zh-CN"
  citation_mode: "project_knowledge"
